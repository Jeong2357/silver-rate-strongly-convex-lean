# SPDX-License-Identifier: GPL-3.0-only
name: Lean verification

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Lean modules
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: "false"
          build: "true"
          build-args: "+StrongSilver.Main +StrongSilver"
          use-mathlib-cache: "true"
          test: "false"
          lint: "false"
      - name: Check source integrity and theorem axioms
        run: python3 scripts/audit_release.py
      - name: Retain verification records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-verification-${{ github.sha }}
          path: verification/
          if-no-files-found: ignore
